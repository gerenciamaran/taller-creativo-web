  <!-- FAQ -->
  <section class="section alt" id="preguntas">
    <div class="wrap narrow">
      <h2>Antes de empezar</h2>
      <details>
        <summary>¿Necesito experiencia previa?</summary>
        <p>No. Las guías empiezan desde cero: qué materiales comprar, cómo usarlos y tu primer proyecto terminado paso a paso.</p>
      </details>
      <details>
        <summary>¿Cómo recibo el material?</summary>
        <p>Apenas se confirma el pago recibes un enlace para descargar la guía (o las guías) en PDF que compraste.</p>
      </details>
      <details>
        <summary>¿Puedo pagar en pesos colombianos?</summary>
        <p>Sí. Usa el selector de moneda en la sección de precios para ver el valor en pesos (COP).</p>
      </details>
      <details>
        <summary>¿Cuánto dura el acceso?</summary>
        <p>Es de por vida: puedes usar la guía cuantas veces quieras, a tu ritmo.</p>
      </details>
      <details>
        <summary>¿Hay videos?</summary>
        <p>Las guías son en PDF y, cuando una lección tiene video, lo ves en tu zona de alumnos junto a la lección. Los videos nuevos que se agreguen a una guía que ya compraste los ves sin pagar de nuevo.</p>
      </details>
      <details>
        <summary>¿Cómo aprender a dibujar desde cero?</summary>
        <p>Con la guía Dibujo Desde Cero empiezas por las formas básicas, la proporción, la luz y la sombra, y llegas a tu primer dibujo terminado, con ejercicios cortos que practicas a tu ritmo. No necesitas talento ni clases previas.</p>
      </details>
      <details>
        <summary>¿Qué materiales necesito para empezar con jabones y velas artesanales?</summary>
        <p>Cada guía incluye una guía de materiales según tu presupuesto, para que compres solo lo necesario y sin experiencia previa. Primero la lees y después decides qué comprar.</p>
      </details>
      <details>
        <summary>¿Puedo vender lo que aprenda a hacer?</summary>
        <p>Sí. Las guías están pensadas para que, si quieres, conviertas lo que aprendes en un ingreso extra, e incluyen una guía de costos y precio de venta.</p>
      </details>
      <details>
        <summary>¿Puedo comprar desde fuera de Colombia?</summary>
        <p>Sí. Con el selector de moneda ves los precios en dólares (US$) y también en pesos colombianos (COP). Si tienes dudas con tu pago, escríbenos por WhatsApp.</p>
      </details>
      <details>
        <summary>¿Y si no me gusta?</summary>
        <p>Tienes 7 días desde la compra para pedir la devolución completa de tu dinero.</p>
      </details>
    </div>
  </section>
